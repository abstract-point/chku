services:
  frontend:
    build:
      context: ../../..
      dockerfile: infra/docker/prod/frontend.Dockerfile
      args:
        VITE_PUBLIC_URL: ${FRONTEND_URL:-${APP_URL:-http://localhost:8090}}
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - chku_prod

  backend:
    build:
      context: ../../..
      dockerfile: infra/docker/prod/backend.Dockerfile
    depends_on:
      - db
    env_file:
      - ../../../apps/chku-backend/.env
    volumes:
      - backend_storage_public:/var/www/backend/storage/app/public
    extra_hosts:
      - "host.docker.internal:172.30.10.1"
    expose:
      - "9000"
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - chku_prod

  queue:
    build:
      context: ../../..
      dockerfile: infra/docker/prod/backend.Dockerfile
    depends_on:
      - db
    env_file:
      - ../../../apps/chku-backend/.env
    volumes:
      - backend_storage_public:/var/www/backend/storage/app/public
    extra_hosts:
      - "host.docker.internal:172.30.10.1"
    command: php artisan queue:work --tries=3 --sleep=3 --timeout=60 --rest=0
    user: www-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - chku_prod

  scheduler:
    build:
      context: ../../..
      dockerfile: infra/docker/prod/backend.Dockerfile
    depends_on:
      - db
    env_file:
      - ../../../apps/chku-backend/.env
    extra_hosts:
      - "host.docker.internal:172.30.10.1"
    command: php artisan schedule:work
    user: www-data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - chku_prod

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_cluster_data:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - chku_prod

  nginx:
    image: nginx:1.31.8-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - chku_prod

volumes:
  postgres_cluster_data:
  backend_storage_public:

networks:
  chku_prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1
